{% extends "base.html" %}

{% block title %}Parking Service &ndash; Exit{% endblock %}

{% block main %}
<!-- LEFT PANEL: exit gate -->
<section class="left-panel">
    <h2>Exit</h2>
    <p>Enter your number plate and tap Exit. If you're paid up, the exit gate will open.</p>

    <div class="form-group">
        <label for="plateInput">Number Plate</label>
        <input type="text" id="plateInput" placeholder="e.g. ABC123" autocomplete="off"
            autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="6"
            inputmode="text">
        <button id="exitBtn">Exit</button>
    </div>

    <div id="messageBox" class="info-box hidden">
        <p>message</p>
    </div>
</section>

<!-- RIGHT PANEL: live availability -->
{% include "_spots.html" %}
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='exit.js') }}"></script>
{% endblock %}
