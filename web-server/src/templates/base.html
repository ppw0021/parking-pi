<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Parking Service{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <h1>Parking Service</h1>
    </header>

    <nav class="main-nav">
        <a href="{{ url_for('root') }}"{% if active == 'entry' %} class="active"{% endif %}>Entry</a>
        <a href="{{ url_for('pay_page') }}"{% if active == 'pay' %} class="active"{% endif %}>Pay</a>
        <a href="{{ url_for('exit_page') }}"{% if active == 'exit' %} class="active"{% endif %}>Exit</a>
    </nav>

    <main>
        {% block main %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='spots.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
